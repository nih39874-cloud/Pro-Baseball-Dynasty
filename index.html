<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#071a25"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="./style.css"/>
  <title>鑽石王朝 | Pro Baseball Dynasty</title>
</head>
<body>
  <div id="app">
    <canvas id="field" aria-label="3D 棒球球場"></canvas>
    <div id="sceneShade"></div>
    <header class="topbar"><div class="brand"><span class="diamondmark">◆</span><div><strong>鑽石王朝</strong><small>PRO BASEBALL DYNASTY</small></div></div><div id="scoreboard" class="scoreboard"></div><div class="top-actions"><span id="connection" class="netpill">LOCAL</span><button id="btn-menu" class="icon-btn" title="選單">☰</button></div></header>
    <div id="infoLeft" class="side-info"></div>
    <div id="toast" role="status"></div>
    <div id="challengeBanner" class="challenge-banner hidden"></div>
    <div class="bottom-left"><div id="joystick" class="stick"><div class="stick-ring"><div id="stick-knob" class="stick-knob"></div></div><span id="stickLabel">瞄準</span></div></div>
    <div id="actionArea" class="action-area"></div>
    <div id="bottomStatus" class="bottom-status"></div>
    <div id="modeBar" class="mode-bar"><span class="mode-label">指揮模式</span><button data-mode="auto">AI 自動</button><button data-mode="coach">總教練</button><button data-mode="field">場上球員</button></div>
    <div id="aimOverlay" class="aim-overlay"><div id="zoneFrame" class="zone-frame"><span id="aimDot" class="aim-dot"></span><span id="batGuide" class="bat-guide"></span></div></div>
    <div id="meter" class="meter hidden"><span class="meter-title">投球精準度</span><div class="meter-track"><div id="meterZone" class="meter-zone"></div><div id="meterNeedle" class="meter-needle"></div></div></div>
    <div id="fieldChoice" class="field-choice hidden"></div>
    <section id="modal" class="modal"><div id="modalBody" class="modal-panel"></div></section>
    <div id="rotate" class="rotate"><span>↻</span><strong>請將手機橫向旋轉</strong><small>鑽石王朝採用橫向操作</small></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
